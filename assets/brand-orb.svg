<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Native OS launch splash icon. expo-splash-screen renders this centered over
    the configured backgroundColor (#EFF4FB). Transparent background so it
    blends with that color seamlessly during the brief native splash window.
  -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFF8EC"/>
      <stop offset="38%"  stop-color="#F1F2F2"/>
      <stop offset="72%"  stop-color="#C7D7EA"/>
      <stop offset="100%" stop-color="#B6C7DD"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="48%" r="42%">
      <stop offset="0%"   stop-color="#FFFDF6"/>
      <stop offset="60%"  stop-color="#FFF4DE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F1E3CC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="196" fill="url(#halo)"/>
  <circle cx="256" cy="251" r="94" fill="url(#core)"/>
</svg>
